<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Pipeline</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b675f; --line: #e3dfd7;
    --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fdeee6;
    --ok: #15803d; --ok-soft: #e7f5ec; --warn: #a16207; --warn-soft: #fbf3dc;
    --bad: #b91c1c; --bad-soft: #fbe9e9; --info: #1d4ed8; --info-soft: #e8eefc;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #1f1e1b; --ink: #ecebe7; --muted: #a29e95; --line: #34322d;
      --accent: #f97316; --accent-ink: #1a0f06; --accent-soft: #3a2415;
      --ok: #4ade80; --ok-soft: #16301f; --warn: #facc15; --warn-soft: #332b10;
      --bad: #f87171; --bad-soft: #3a1717; --info: #93b4fd; --info-soft: #1c2745;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 2px 0 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .chip.no { background: var(--bad-soft); color: var(--bad); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .fila { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .fila + .fila { margin-top: 14px; }
  .etq { width: 140px; color: var(--muted); font-size: 13.5px; }
  .ruta { flex: 1; min-width: 200px; font-family: var(--mono); font-size: 13px; padding: 7px 10px; background: var(--bg);
          border-radius: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; }
  .seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .nota { color: var(--muted); font-size: 13px; }
  button.b { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
             padding: 7px 14px; border-radius: 9px; cursor: pointer; }
  button.b:hover { border-color: var(--muted); }
  button.b.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.b.pri:hover { filter: brightness(1.07); }
  button.b.peligro { color: var(--bad); }
  button.b:disabled { opacity: .5; cursor: default; }
  #zona { border: 2px dashed var(--line); border-radius: 14px; padding: 34px 20px; text-align: center; cursor: pointer;
          background: var(--panel); transition: border-color .15s, background .15s; margin-bottom: 24px; }
  #zona:hover, #zona.sobre { border-color: var(--accent); background: var(--accent-soft); }
  #zona strong { font-size: 17px; display: block; margin-bottom: 4px; }
  #subida { height: 6px; background: var(--line); border-radius: 3px; margin-top: 14px; overflow: hidden; display: none; }
  #subida div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .vacio { color: var(--muted); text-align: center; padding: 26px; border: 1px dashed var(--line); border-radius: 14px; }
  .libro { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
  .libro .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .libro .tit { font-weight: 650; font-size: 16px; word-break: break-word; }
  .libro .meta { color: var(--muted); font-size: 12.5px; }
  .est { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--info-soft); color: var(--info); }
  .est.terminado { background: var(--ok-soft); color: var(--ok); }
  .est.error { background: var(--bad-soft); color: var(--bad); }
  .est.esperando_confirmacion { background: var(--accent-soft); color: var(--accent); }
  .est.cancelado, .est.interrumpido, .est.en_fila { background: var(--bg); color: var(--muted); }
  .est.esperando_lote { background: var(--warn-soft); color: var(--warn); }
  .pasos { display: flex; gap: 6px; margin: 12px 0 8px; }
  .paso { flex: 1; font-size: 12px; color: var(--muted); }
  .paso i { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 4px; }
  .paso.hecho i { background: var(--ok); }
  .paso.activo i { background: var(--accent); animation: pulso 1.4s ease-in-out infinite; }
  .paso.activo { color: var(--ink); font-weight: 600; }
  @keyframes pulso { 50% { opacity: .45; } }
  .msg { font-size: 13.5px; color: var(--muted); font-family: var(--mono); word-break: break-word; }
  .pregunta { margin-top: 12px; border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; }
  .pregunta .costo { font-size: 28px; font-weight: 750; letter-spacing: -.02em; }
  .pregunta ul { margin: 6px 0 12px; padding-left: 18px; font-size: 13px; font-family: var(--mono); color: var(--ink); }
  .resumen { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 4px; }
  .resumen div { font-size: 12.5px; color: var(--muted); }
  .resumen b { display: block; font-size: 20px; color: var(--ink); }
  .problemas { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  pre.bit { max-height: 300px; overflow: auto; background: var(--bg); border-radius: 10px; padding: 10px 12px; font: 12px/1.45 var(--mono);
            white-space: pre-wrap; word-break: break-word; margin: 12px 0 0; }
  #aviso { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; max-width: 90vw; z-index: 5; }
  .alerta { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; display: none; }
  @media (max-width: 600px) { .etq { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Book <span>Pipeline</span></h1>
      <p class="sub">De un libro a su base de conocimiento: <code>_core.md</code> + <code>_biblioteca.md</code></p>
    </div>
    <div class="chips" id="llaves"></div>
  </header>

  <div class="alerta" id="faltan"></div>

  <section class="panel">
    <div class="fila" id="filaCarpeta">
      <div class="etq">Carpeta de salida</div>
      <div class="ruta" id="carpeta" title="">…</div>
      <button class="b" id="cambiar">Cambiar…</button>
    </div>
    <div class="fila">
      <div class="etq">Modo</div>
      <div class="seg" id="modo">
        <button data-m="lote">Lote</button>
        <button data-m="inmediato">Inmediato</button>
      </div>
      <div class="nota" id="notaModo"></div>
    </div>
  </section>

  <div id="zona">
    <strong>Arrastra aquí el libro</strong>
    <span class="nota">o haz clic para elegirlo · EPUB, PDF o DOCX</span>
    <div id="subida"><div></div></div>
    <input type="file" id="archivo" accept=".epub,.pdf,.docx" hidden multiple>
  </div>

  <h2>Libros</h2>
  <div id="lista"></div>
</div>
<div id="aviso"></div>

<script>
const $ = s => document.querySelector(s);
const H = {"X-BPP": "1"};
let estado = null, abiertos = new Set(), bitacoras = {}, ocupado = false;

const NOMBRES = {
  en_fila: "En fila", convirtiendo: "Convirtiendo", extrayendo: "Extrayendo",
  esperando_confirmacion: "Aprueba el costo", esperando_lote: "Lote en proceso",
  terminado: "Listo", error: "Error", cancelado: "Cancelado", interrumpido: "Interrumpido"
};
const NOTAS = {
  lote: "Más barato (~50%). Tarda de minutos a horas; la app espera sola.",
  inmediato: "Resultado en minutos. Cuesta aproximadamente el doble."
};

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function avisar(t) { const a = $("#aviso"); a.textContent = t; a.style.display = "block"; clearTimeout(a._t); a._t = setTimeout(() => a.style.display = "none", 4200); }
function usd(x) { return x == null ? "—" : "$" + Number(x).toFixed(2); }

async function api(ruta, datos) {
  const op = datos === undefined ? {} : {method: "POST", headers: {...H, "Content-Type": "application/json"}, body: JSON.stringify(datos)};
  const r = await fetch(ruta, op);
  const j = await r.json().catch(() => ({ok: false, error: "Respuesta inválida del motor."}));
  if (!j.ok && !j.cancelado) throw new Error(j.error || "Error");
  return j;
}

async function cargarEstado() {
  estado = await api("/api/estado");
  const ll = estado.llaves, fu = estado.fuentes || {};
  const chip = (nom, k) => `<span class="chip ${ll[k] ? "" : "no"}" title="${fu[k] === "app" ? "Llave exclusiva de esta app" : fu[k] ? "Llave general" : "Sin llave"}">${nom} ${ll[k] ? "✓" : "✗"}${fu[k] === "app" ? " · exclusiva" : ""}</span>`;
  $("#llaves").innerHTML = chip("Claude", "anthropic") + chip("Gemini", "gemini");
  const falt = [!ll.anthropic && "BPP_ANTHROPIC_API_KEY", !ll.gemini && "GEMINI_API_KEY"].filter(Boolean);
  $("#faltan").style.display = falt.length ? "block" : "none";
  $("#faltan").textContent = falt.length ? `Falta la variable de entorno ${falt.join(" y ")}. Configúrala en Windows y vuelve a abrir la app.` : "";
  pintarAjustes();
}

function pintarAjustes() {
  const a = estado.ajustes;
  $("#carpeta").textContent = "\u200E" + a.carpeta_salida + "\u200E";
  $("#carpeta").title = a.carpeta_salida;
  $("#cambiar").style.display = estado.local ? "" : "none";
  $("#filaCarpeta").style.display = estado.local ? "" : "none";
  document.querySelectorAll("#modo button").forEach(b => b.classList.toggle("on", b.dataset.m === a.modo));
  $("#notaModo").textContent = NOTAS[a.modo];
}

$("#cambiar").onclick = async () => {
  try {
    const j = await api("/api/elegir-carpeta", {});
    if (j.ok) { estado.ajustes = j.ajustes; pintarAjustes(); avisar("Carpeta guardada."); }
  } catch (e) { avisar(e.message); }
};
document.querySelectorAll("#modo button").forEach(b => b.onclick = async () => {
  const j = await api("/api/ajustes", {modo: b.dataset.m});
  estado.ajustes = j.ajustes; pintarAjustes();
});

// ── Subir libros ──
const zona = $("#zona"), inp = $("#archivo");
zona.onclick = () => { if (!ocupado) inp.click(); };
inp.onchange = () => { subirVarios([...inp.files]); inp.value = ""; };
["dragenter", "dragover"].forEach(e => zona.addEventListener(e, ev => { ev.preventDefault(); zona.classList.add("sobre"); }));
["dragleave", "drop"].forEach(e => zona.addEventListener(e, ev => { ev.preventDefault(); zona.classList.remove("sobre"); }));
zona.addEventListener("drop", ev => subirVarios([...ev.dataTransfer.files]));
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

async function subirVarios(archivos) {
  for (const f of archivos) {
    const ext = "." + f.name.split(".").pop().toLowerCase();
    if (!estado.extensiones.includes(ext)) { avisar(`"${f.name}": solo se aceptan EPUB, PDF o DOCX.`); continue; }
    if (f.size > estado.max_mb * 1048576) { avisar(`"${f.name}" pasa de ${estado.max_mb} MB.`); continue; }
    try { await subir(f); avisar(`"${f.name}" agregado a la fila.`); }
    catch (e) { avisar(e.message); }
  }
  refrescar();
}

function subir(f) {
  return new Promise((ok, mal) => {
    ocupado = true;
    const barra = $("#subida"), rel = barra.firstElementChild;
    barra.style.display = "block"; rel.style.width = "0";
    const x = new XMLHttpRequest();
    x.open("POST", "/api/trabajos");
    x.setRequestHeader("X-BPP", "1");
    x.setRequestHeader("X-Archivo", encodeURIComponent(f.name));
    x.setRequestHeader("X-Modo", estado.ajustes.modo);
    x.upload.onprogress = e => { if (e.lengthComputable) rel.style.width = (100 * e.loaded / e.total) + "%"; };
    x.onload = () => {
      ocupado = false; barra.style.display = "none";
      let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
      j.ok ? ok(j) : mal(new Error(j.error || "No se pudo subir el libro."));
    };
    x.onerror = () => { ocupado = false; barra.style.display = "none"; mal(new Error("No se pudo subir el libro.")); };
    x.send(f);
  });
}

// ── Lista de libros ──
function pasos(t) {
  const conv = t.conversion || t.etapa === "extraccion" || t.resultado || t.estado === "terminado";
  const ext = t.estado === "terminado";
  const act = ["convirtiendo","extrayendo","esperando_confirmacion","esperando_lote"].includes(t.estado);
  const c = (hecho, activo) => hecho ? "hecho" : (activo ? "activo" : "");
  return `<div class="pasos">
    <div class="paso ${c(conv, act && t.etapa === "conversion")}"><i></i>1 · Conversión</div>
    <div class="paso ${c(ext, act && t.etapa === "extraccion")}"><i></i>2 · Extracción</div>
    <div class="paso ${c(ext, false)}"><i></i>Listo</div></div>`;
}

function tarjeta(t) {
  let h = `<div class="libro" id="t-${t.id}">
    <div class="top"><div><div class="tit">${esc(t.titulo)}</div>
      <div class="meta">${esc(t.nombre)} · modo ${esc(t.modo)} · ${esc(t.creado.replace("T", " "))}</div></div>
      <span class="est ${t.estado}">${NOMBRES[t.estado] || t.estado}</span></div>
    ${pasos(t)}
    <div class="msg">${esc(t.mensaje)}</div>`;
  if (t.pregunta) {
    const p = t.pregunta;
    h += `<div class="pregunta"><div class="nota">${p.programa === "convert" ? "Conversión (Gemini)" : "Extracción (Claude + Gemini)"} · costo estimado</div>
      <div class="costo">~${usd(p.costo)} USD</div>
      <ul>${(p.lineas || []).map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <div class="acciones" style="margin-top:0">
        <button class="b pri" data-a="si" data-id="${t.id}">Aprobar y continuar</button>
        <button class="b" data-a="no" data-id="${t.id}">No, cancelar</button></div></div>`;
  }
  const r = t.resultado;
  if (r) {
    h += `<div class="resumen"><div><b>${r.entradas ?? "—"}</b>entradas</div><div><b>${r.avisos ?? "—"}</b>avisos</div>
      <div><b>${usd(t.costo)}</b>costo del libro</div>${r.parcial ? "<div><b>Parcial</b>prueba</div>" : ""}</div>`;
    if ((r.problemas || []).length) h += `<div class="problemas"><b>Problemas:</b><br>${r.problemas.map(esc).join("<br>")}</div>`;
  }
  h += `<div class="acciones">`;
  if (t.estado === "terminado" || t.salida_existe) {
    h += estado.local ? `<button class="b ${t.estado === "terminado" ? "pri" : ""}" data-a="abrir" data-id="${t.id}">Abrir carpeta</button>`
                      : (r ? `<a class="b pri" href="/api/trabajos/${t.id}/zip" style="text-decoration:none">Descargar .zip</a>` : "");
  }
  if (t.puede_cancelar && !t.pregunta) h += `<button class="b peligro" data-a="cancelar" data-id="${t.id}">Cancelar</button>`;
  if (t.puede_reanudar) h += `<button class="b" data-a="reanudar" data-id="${t.id}">Reanudar</button>`;
  h += `<button class="b" data-a="detalle" data-id="${t.id}">${abiertos.has(t.id) ? "Ocultar detalle" : "Ver detalle"}</button>`;
  if (t.puede_eliminar) h += `<button class="b" data-a="eliminar" data-id="${t.id}" title="Solo la quita de la lista; los archivos del KB no se borran">Quitar de la lista</button>`;
  h += `</div>`;
  if (abiertos.has(t.id)) h += `<pre class="bit" id="b-${t.id}">${esc((bitacoras[t.id] || []).join("\n")) || "Sin registro todavía."}</pre>`;
  return h + `</div>`;
}

async function refrescar() {
  let j;
  try { j = await api("/api/trabajos"); } catch (e) { return; }
  for (const id of abiertos) {
    try { bitacoras[id] = (await api(`/api/trabajos/${id}/bitacora`)).lineas; } catch (e) { abiertos.delete(id); }
  }
  const pos = {};
  document.querySelectorAll("pre.bit").forEach(p => pos[p.id] = p.scrollHeight - p.scrollTop - p.clientHeight < 30);
  $("#lista").innerHTML = j.trabajos.length ? j.trabajos.map(tarjeta).join("")
    : `<div class="vacio">Todavía no hay libros. Arrastra uno arriba para empezar.</div>`;
  document.querySelectorAll("pre.bit").forEach(p => { if (pos[p.id] !== false) p.scrollTop = p.scrollHeight; });
}

$("#lista").addEventListener("click", async ev => {
  const b = ev.target.closest("button[data-a]"); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  try {
    if (a === "detalle") { abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id); }
    else if (a === "si" || a === "no") { b.disabled = true; await api(`/api/trabajos/${id}/responder`, {si: a === "si"}); }
    else if (a === "cancelar") { if (!confirm("¿Cancelar este libro? Lo ya hecho queda guardado.")) return; await api(`/api/trabajos/${id}/cancelar`, {}); }
    else if (a === "eliminar") { if (!confirm("¿Quitarlo de la lista? Los archivos del KB NO se borran.")) return; await api(`/api/trabajos/${id}/eliminar`, {}); abiertos.delete(id); }
    else await api(`/api/trabajos/${id}/${a}`, {});
  } catch (e) { avisar(e.message); }
  refrescar();
});

cargarEstado().then(refrescar).catch(e => avisar("No se pudo conectar con el motor: " + e.message));
setInterval(refrescar, 2000);
</script>
</body>
</html>
